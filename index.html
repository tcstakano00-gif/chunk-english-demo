function isQuestion(en){let t=en.trim().replace(/[.!]+$/,'');return /\?$/.test(en.trim())||/^(how|what|when|where|why|who|which|can|could|would|will|do|does|did|are|is|have|has|shall|should|may)\b/i.test(t)}
function roleFor(x){return state.role==='auto'?(isQuestion(selected()[0])?'user':'ai'):state.role}
function changeRole(v){state.role=v;state.answer=0;persist();render()}
function expectedReply(text){let t=text.toLowerCase();if(/how about you|how are you|how are you doing/.test(t))return ['I’m doing well, thanks.','元気ですよ、ありがとう。'];if(/what do you think|your opinion/.test(t))return ['I think that’s a good idea.','いい考えだと思います。'];if(/where/.test(t))return ['I’m not sure yet.','まだはっきりわかりません。'];if(/when|what time/.test(t))return ['Tomorrow works for me.','明日なら大丈夫です。'];if(/would you like|do you want|can i|could you|can you|shall we|are you|is it|do you|have you/.test(t))return ['Yes, that sounds good.','はい、いいですね。'];if(/thank/.test(t))return ['You’re welcome.','どういたしまして。'];if(/sorry/.test(t))return ['No problem.','大丈夫ですよ。'];if(/like to|i need|i want/.test(t))return ['Sure, let’s do that.','もちろん、そうしましょう。'];return ['I see. Tell me more.','なるほど。もう少し聞かせてください。']}

function scenario(x){

 const v=selected();
 const raw=[[x.en,x.ja],[v[0],v[1]]];
 // Keep both the original chunk and the *currently selected* example as possible responses.
 const choices=raw.filter((a,i,all)=>all.findIndex(z=>z[0].trim().toLowerCase()===a[0].trim().toLowerCase())===i);
 const alternate={1:['That sounds good.','それはよさそうですね。'],7:['Almost.','もう少しです。'],16:['Not yet.','まだです。'],21:['How are you?','お元気ですか？'],93:['Yes, please.','はい、お願いします。']};

}
function target(kind){let x=item(),v=selected(),s=scenario(x);return kind==='chunk'?x.en:kind==='example'?v[0]:kind==='question'?s.question:kind==='aiReply'?expectedReply(s.choices[state.answer][0])[0]:s.choices[state.answer][0]}function speak(kind){if(!('speechSynthesis'in window)){alert('音声再生に対応していません');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(target(kind));u.lang='en-US';u.rate=.82;speechSynthesis.speak(u)}function setMicIndicator(active){document.querySelectorAll('[data-mic-button]').forEach(b=>{b.classList.toggle('mic-active',active);b.setAttribute('aria-label',active?'マイク使用中・発音を聞き取り中':'発音チェック');b.setAttribute('aria-pressed',String(active));if(!b.dataset.originalText)b.dataset.originalText=b.textContent;b.textContent=active?'🔴 聞き取り中…':b.dataset.originalText});let n=$('voiceNote');if(n&&active)n.textContent='● マイク使用中：発音を聞き取り中です（最大10秒）。'}

let aiBusy=false;
async function aiAssess(kind){

async function wav16k(pcm,rate){let length=Math.max(1,Math.ceil(pcm.length*16000/rate)),offline=new OfflineAudioContext(1,length,16000);let original=offline.createBuffer(1,pcm.length,rate);original.copyToChannel(pcm,0);let src=offline.createBufferSource();src.buffer=original;src.connect(offline.destination);src.start();let normalized=(await offline.startRendering()).getChannelData(0);let out=new ArrayBuffer(44+normalized.length*2),v=new DataView(out);function put(at,str){for(let i=0;i<str.length;i++)v.setUint8(at+i,str.charCodeAt(i))}put(0,'RIFF');v.setUint32(4,36+normalized.length*2,true);put(8,'WAVE');put(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,16000,true);v.setUint32(28,32000,true);v.setUint16(32,2,true);v.setUint16(34,16,true);put(36,'data');v.setUint32(40,normalized.length*2,true);for(let i=0;i<normalized.length;i++){let n=Math.max(-1,Math.min(1,normalized[i]));v.setInt16(44+i*2,n<0?n*32768:n*32767,true)}return out}
function aiResultsHTML(){const a=state.aiLatest;if(!a)return '<div class="card">AI採点結果がありません。</div>';let escs=esc;let metric=[['発音の正確さ',a.accuracy],['流暢さ',a.fluency],['抑揚・強弱',a.prosody],['文章の完全性',a.completeness]].filter(x=>x[1]!=null);let details=metric.map(([name,value])=>`<div>${escs(name)}<b>${Math.round(value)}</b></div>`).join('');let words=(a.words||[]).map(w=>`<span class="wordgrade ${w.accuracy<75?'low':''}">${escs(w.word)} ${Math.round(w.accuracy)}</span>`).join('');let weaker=[...(a.words||[])].filter(w=>w.accuracy<80).sort((a,b)=>a.accuracy-b.accuracy).slice(0,2);let tip=weaker.length?'特に「'+weaker.map(w=>w.word).join('」「')+'」を、お手本と聞き比べてゆっくり言い直しましょう。':'お手本と聞き比べ、単語のつながりと文全体の強弱も練習しましょう。';return header('AI発音採点')+`<div class="card"><div class="section">Azure Speechによる発音評価</div>${contentBox(a.target,'')}<div class="score">${Math.round(a.overall)} / 100</div><div class="aigrid">${details}</div><div class="section">単語別の評価</div>${words||'単語別データなし'}<div class="notice">${escs(tip)}<br>※これは発音評価サービスの指標です。ネイティブ度を厳密に示すものではありません。</div><p class="tiny">音声は採点のためAzureに送信されます。端末にはスコアだけを保存します。</p><button class="btn blue full" onclick="go('${['question','aiReply','reply'].includes(a.kind)?'conversation':a.kind==='example'?'example':'pron'}')">↶ 同じ英文をもう一度練習</button>${linkBar()}</div>`}
